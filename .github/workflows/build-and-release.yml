name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Environment & Keystore
        run: |
          # تجهيز ملف .env للـ Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # تجهيز مفتاح التوقيع التجريبي debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Determine Version Name and Tag
        id: version_step
        run: |
          BUILD_NUM=${{ github.run_number }}
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VER_NAME="${TAG_NAME#v}"
          else
            VER_NAME="1.${BUILD_NUM}"
            TAG_NAME="v1.${BUILD_NUM}"
          fi
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          echo "version=${VER_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          echo "Calculated Version: ${VER_NAME} (Tag: ${TAG_NAME})"

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Prepare APK Files
        run: |
          mkdir -p release_assets
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$ORIGINAL_APK" ]; then
            echo "✅ APK generated successfully at $ORIGINAL_APK"
            cp "$ORIGINAL_APK" release_assets/app-debug.apk
            cp "$ORIGINAL_APK" "release_assets/EchoOfBattle-${{ steps.version_step.outputs.tag }}.apk"
            ls -lh release_assets/
          else
            echo "❌ Error: APK not found at $ORIGINAL_APK"
            exit 1
          fi

      - name: Generate version.json for In-Game Auto Updater
        run: |
          cat <<EOF > release_assets/version.json
          {
            "version": "${{ steps.version_step.outputs.version }}",
            "title": "تحديث جديد - صدى المعركة ${{ steps.version_step.outputs.tag }}",
            "notes": "تم بناء هذا الإصدار ونشره تلقائياً بالكامل عبر مشغل GitHub Actions بتاريخ ${{ steps.version_step.outputs.date }} مع قاعدة بيانات جوجل فايربيز (Firebase) الجديدة.",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version_step.outputs.tag }}/app-debug.apk"
          }
          EOF
          cp release_assets/version.json version.json
          cat version.json

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoOfBattle-APK-${{ steps.version_step.outputs.tag }}
          path: release_assets/*.apk
          retention-days: 30

      - name: Create or Update Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.version_step.outputs.tag }}"
          git push -f origin "${{ steps.version_step.outputs.tag }}" || echo "Tag push completed or skipped"

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "⚔️ صدى المعركة (Echo of Battle) - ${{ steps.version_step.outputs.tag }}"
          body: |
            ## 🚀 تم بناء وتحديث اللعبة بنجاح عبر GitHub Actions
            
            - **الإصدار:** `${{ steps.version_step.outputs.tag }}`
            - **قاعدة البيانات:** Google Firebase Cloud Firestore & Auth (فايربيز السحابية من جوجل)
            - **تاريخ النشر:** ${{ steps.version_step.outputs.date }}
            - **طريقة البناء:** تلقائي ومباشر 100% فور رفع التعديلات.
            
            ---
            ### 📥 روابط التحميل المباشر لملف الـ APK:
            1. **[تحميل EchoOfBattle-${{ steps.version_step.outputs.tag }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_step.outputs.tag }}/EchoOfBattle-${{ steps.version_step.outputs.tag }}.apk)**
            2. **[تحميل app-debug.apk (للتحديث التلقائي)](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_step.outputs.tag }}/app-debug.apk)**

            ---
            ### 🌟 الميزات والتعديلات الجديدة:
            - **قاعدة بيانات فايربيز من جوجل (Google Firebase)** لحفظ الذهب والعتاد والمستوى أونلاين.
            - **المتصدرون أونلاين عبر Firebase Firestore** في الوقت الفعلي.
            - **30 سلاحاً و 30 قوة خارقة** مع مؤثرات صوتية حصرية.
            - **ناطق صوتي باللغة العربية واهتزازات تفاعلية للمكفوفين**.
            - **نظام التحديث التلقائي المباشر** داخل اللعبة فور توفر أي إصدار جديد.
          files: |
            release_assets/app-debug.apk
            release_assets/EchoOfBattle-${{ steps.version_step.outputs.tag }}.apk
            release_assets/version.json
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
